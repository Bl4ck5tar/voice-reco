<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speech Recognition System | 语音识别系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap');

        body {
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            background: #0a0e27;
            color: #00ff88;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(0deg, transparent 24%, rgba(0, 255, 136, 0.05) 25%, rgba(0, 255, 136, 0.05) 26%, transparent 27%, transparent 74%, rgba(0, 255, 136, 0.05) 75%, rgba(0, 255, 136, 0.05) 76%, transparent 77%, transparent),
                linear-gradient(90deg, transparent 24%, rgba(0, 255, 136, 0.05) 25%, rgba(0, 255, 136, 0.05) 26%, transparent 27%, transparent 74%, rgba(0, 255, 136, 0.05) 75%, rgba(0, 255, 136, 0.05) 76%, transparent 77%, transparent);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 1;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            background: linear-gradient(135deg, #0f1430 0%, #1a1f3a 100%);
            border: 2px solid #00ff88;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.3), inset 0 0 20px rgba(0, 255, 136, 0.05);
            overflow: hidden;
            position: relative;
            z-index: 2;
        }

        .terminal-header {
            background: linear-gradient(90deg, #0a0e27 0%, #1a1f3a 100%);
            border-bottom: 2px solid #00ff88;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9em;
        }

        .terminal-dots {
            display: flex;
            gap: 8px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 1px solid #00ff88;
        }

        .dot.red { background: #ff4444; }
        .dot.yellow { background: #ffaa00; }
        .dot.green { background: #00ff88; }

        .terminal-title {
            flex: 1;
            text-align: center;
            color: #00ff88;
            font-weight: 700;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }

        .header {
            padding: 40px;
            text-align: center;
            border-bottom: 1px solid rgba(0, 255, 136, 0.2);
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            color: #00ff88;
            letter-spacing: 3px;
            font-weight: 700;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.8);
            animation: glow 3s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { text-shadow: 0 0 10px rgba(0, 255, 136, 0.8), 0 0 20px rgba(0, 150, 255, 0.4); }
            50% { text-shadow: 0 0 20px rgba(0, 255, 136, 1), 0 0 30px rgba(0, 150, 255, 0.6); }
        }

        .header p {
            font-size: 1em;
            color: #00ccff;
            letter-spacing: 1px;
        }

        .content {
            padding: 40px;
        }

        .form-group {
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 10px;
            color: #00ff88;
            text-transform: uppercase;
            font-size: 0.85em;
            letter-spacing: 1px;
        }

        input[type="file"], select {
            width: 100%;
            padding: 12px;
            border: 2px solid #00ff88;
            background: rgba(0, 255, 136, 0.05);
            color: #00ff88;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.95em;
            transition: all 0.3s;
        }

        input[type="file"]::file-selector-button {
            background: #00ff88;
            color: #0a0e27;
            border: none;
            padding: 8px 16px;
            cursor: pointer;
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
            transition: all 0.3s;
        }

        input[type="file"]::file-selector-button:hover {
            background: #00ccff;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }

        input[type="file"]:focus, select:focus {
            outline: none;
            border-color: #00ccff;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.5), inset 0 0 10px rgba(0, 255, 136, 0.1);
            background: rgba(0, 255, 136, 0.1);
        }

        select {
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2300ff88' stroke-width='2'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 10px center;
            background-size: 20px;
            padding-right: 35px;
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 14px 32px;
            font-size: 0.95em;
            border: 2px solid #00ff88;
            cursor: pointer;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
        }

        .btn-upload {
            background: #00ff88;
            color: #0a0e27;
        }

        .btn-upload:hover {
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.8);
        }

        .btn-upload:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-reset {
            background: transparent;
            color: #00ff88;
            border: 2px solid #00ff88;
        }

        .btn-reset:hover {
            background: #00ff88;
            color: #0a0e27;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.6);
        }

        .file-name {
            margin-top: 8px;
            font-size: 0.85em;
            color: #00ccff;
        }

        .loading {
            display: none;
            text-align: center;
            margin: 30px 0;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            width: 40px;
            height: 40px;
            margin: 0 auto 15px;
            border: 3px solid rgba(0, 255, 136, 0.2);
            border-top: 3px solid #00ff88;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading p {
            color: #00ccff;
            letter-spacing: 2px;
        }

        .error {
            background: rgba(255, 68, 68, 0.1);
            color: #ff6666;
            padding: 15px;
            border: 2px solid #ff4444;
            margin-bottom: 15px;
            display: none;
            font-weight: 600;
        }

        .error.show {
            display: block;
        }

        .result-section {
            margin-top: 30px;
            display: none;
        }

        .result-section.show {
            display: block;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-header {
            border-bottom: 2px solid #00ff88;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .result-header h2 {
            color: #00ff88;
            font-size: 1.3em;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: rgba(0, 255, 136, 0.05);
            padding: 20px;
            border: 1px solid #00ff88;
        }

        .stat-label {
            font-size: 0.8em;
            color: #00ccff;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-value {
            font-size: 1.5em;
            color: #00ff88;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }

        .result-card {
            background: rgba(0, 255, 136, 0.05);
            border: 1px solid #00ff88;
            padding: 20px;
            margin-bottom: 15px;
        }

        .result-card h3 {
            color: #00ff88;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(0, 255, 136, 0.4);
        }

        .result-text {
            color: #00ccff;
            line-height: 1.8;
            padding: 15px;
            background: rgba(0, 0, 0, 0.2);
            border-left: 3px solid #00ff88;
        }

        .mic-controls {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .btn-mic, .btn-mic-stop {
            padding: 10px 20px;
            font-size: 0.9em;
            border: 2px solid #00ff88;
            cursor: pointer;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
            background: #00ff88;
            color: #0a0e27;
            flex: 1;
            min-width: 120px;
        }

        .btn-mic:hover:not(:disabled) {
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.8);
            transform: scale(1.05);
        }

        .btn-mic-stop {
            background: #ff4444;
            border-color: #ff4444;
            color: white;
            flex: 1;
            min-width: 120px;
        }

        .btn-mic-stop:hover:not(:disabled) {
            box-shadow: 0 0 20px rgba(255, 68, 68, 0.8);
            transform: scale(1.05);
        }

        .btn-mic:disabled, .btn-mic-stop:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .recording-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #666;
            transition: all 0.3s;
        }

        .recording-indicator.active {
            background: #ff4444;
            box-shadow: 0 0 10px #ff4444;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.2); }
        }

        .recording-time {
            color: #00ccff;
            font-size: 0.9em;
            min-width: 50px;
        }

        @media (max-width: 600px) {
            .header h1 { font-size: 1.8em; }
            .stats { grid-template-columns: 1fr; }
            .button-group { flex-direction: column; }
            button { width: 100%; }
            .mic-controls { flex-direction: column; }
            .btn-mic, .btn-mic-stop { width: 100%; min-width: auto; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="terminal-header">
            <div class="terminal-dots">
                <div class="dot red"></div>
                <div class="dot yellow"></div>
                <div class="dot green"></div>
            </div>
            <div class="terminal-title">$ 语音识别系统 v1.0</div>
        </div>

        <div class="header">
            <h1>🎤 语音识别</h1>
            <p>> 自动语言识别 | 多语言翻译</p>
        </div>

        <div class="content">
            <div class="error" id="error-message"></div>

            <form id="transcribe-form">
                <div class="form-group">
                    <label for="audio-file">📁 音频文件输入</label>
                    <input type="file" id="audio-file" accept="audio/*">
                    <div class="file-name" id="file-name"></div>
                </div>

                <div class="form-group">
                    <label for="mic-recording">🎤 麦克风录制</label>
                    <div class="mic-controls">
                        <button type="button" class="btn-mic" id="mic-start">🎙️ 开始录制</button>
                        <button type="button" class="btn-mic-stop" id="mic-stop" disabled>⏹️ 停止录制</button>
                        <span class="recording-indicator" id="recording-indicator"></span>
                        <div class="recording-time" id="recording-time"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="target-lang">🌐 目标语言 (可选)</label>
                    <select id="target-lang">
                        <option value="">-- 自动检测 --</option>
                        <option value="en">English (英文)</option>
                        <option value="zh">中文 (Chinese)</option>
                        <option value="ja">日本語 (Japanese)</option>
                        <option value="ko">한국어 (Korean)</option>
                    </select>
                </div>

                <div class="button-group">
                    <button type="submit" class="btn-upload" id="submit-btn">▶ 转录</button>
                    <button type="reset" class="btn-reset">⟲ 重置</button>
                </div>
            </form>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>> 处理音频中...</p>
            </div>

            <div class="result-section" id="result-section">
                <div style="height: 2px; background: linear-gradient(90deg, transparent, #00ff88, transparent); margin: 20px 0;"></div>
                
                <div class="result-header">
                    <h2>📊 结果</h2>
                </div>

                <div class="stats">
                    <div class="stat-box">
                        <div class="stat-label">检测到的语言</div>
                        <div class="stat-value" id="detected-lang">--</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">状态</div>
                        <div class="stat-value">✓ 完成</div>
                    </div>
                </div>

                <div class="result-card">
                    <h3>[ 转录结果 ]</h3>
                    <div class="result-text" id="transcribed-text"></div>
                </div>

                <div class="result-card" id="ai-correction-card" style="display: none;">
                    <h3>[ AI智能修正 ]</h3>
                    <div class="result-text" id="ai-corrected-text"></div>
                </div>

                <div class="result-card" id="translation-card" style="display: none;">
                    <h3>[ 翻译结果 ]</h3>
                    <div class="result-text" id="translated-text"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:5000';
        const SILICONFLOW_API_URL = 'https://api.siliconflow.cn/v1/chat/completions';
        const SILICONFLOW_API_KEY = 'SILICONFLOW_API_KEY_PLACEHOLDER';
        const SILICONFLOW_MODEL = 'SILICONFLOW_MODEL_PLACEHOLDER';
        const SILICONFLOW_PLACEHOLDER_VALUES = new Set([
            '',
            'SILICONFLOW_API_KEY_PLACEHOLDER',
            'SILICONFLOW_MODEL_PLACEHOLDER'
        ]);
        const form = document.getElementById('transcribe-form');
        const audioInput = document.getElementById('audio-file');
        const targetLangSelect = document.getElementById('target-lang');
        const loading = document.getElementById('loading');
        const resultSection = document.getElementById('result-section');
        const errorDiv = document.getElementById('error-message');
        const fileNameDiv = document.getElementById('file-name');

        // 麦克风相关变量
        let mediaRecorder = null;
        let audioChunks = [];
        let recordingStartTime = null;
        let recordingTimer = null;
        let micStream = null;
        let recordedAudioBlob = null;

        const micStartBtn = document.getElementById('mic-start');
        const micStopBtn = document.getElementById('mic-stop');
        const recordingIndicator = document.getElementById('recording-indicator');
        const recordingTimeDiv = document.getElementById('recording-time');
        const submitBtn = document.getElementById('submit-btn');
        const detectedLangDiv = document.getElementById('detected-lang');
        const transcribedTextDiv = document.getElementById('transcribed-text');
        const aiCorrectionCard = document.getElementById('ai-correction-card');
        const aiCorrectedTextDiv = document.getElementById('ai-corrected-text');
        const translationCard = document.getElementById('translation-card');
        const translatedTextDiv = document.getElementById('translated-text');

        // 麦克风开始录制
        micStartBtn.addEventListener('click', async (e) => {
            e.preventDefault();
            try {
                micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioChunks = [];
                recordedAudioBlob = null;
                
                mediaRecorder = new MediaRecorder(micStream);
                mediaRecorder.ondataavailable = (event) => {
                    audioChunks.push(event.data);
                };

                mediaRecorder.onstop = () => {
                    recordedAudioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                    fileNameDiv.textContent = `✓ 录制的音频 (${(recordedAudioBlob.size / 1024).toFixed(2)} KB)`;
                    micStream.getTracks().forEach(track => track.stop());
                };

                mediaRecorder.start();
                recordingStartTime = Date.now();
                recordingTimer = setInterval(updateRecordingTime, 100);

                micStartBtn.disabled = true;
                micStopBtn.disabled = false;
                recordingIndicator.classList.add('active');
                errorDiv.classList.remove('show');
            } catch (error) {
                showError('无法访问麦克风: ' + error.message);
            }
        });

        // 麦克风停止录制
        micStopBtn.addEventListener('click', (e) => {
            e.preventDefault();
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
                clearInterval(recordingTimer);
                
                micStartBtn.disabled = false;
                micStopBtn.disabled = true;
                recordingIndicator.classList.remove('active');
                recordingTimeDiv.textContent = '';
            }
        });

        function updateRecordingTime() {
            if (recordingStartTime) {
                const elapsed = Math.floor((Date.now() - recordingStartTime) / 1000);
                const minutes = Math.floor(elapsed / 60);
                const seconds = elapsed % 60;
                recordingTimeDiv.textContent = `${minutes}:${String(seconds).padStart(2, '0')}`;
            }
        }

        audioInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                const file = e.target.files[0];
                const size = file.size > 1024 * 1024 
                    ? (file.size / (1024 * 1024)).toFixed(2) + ' MB'
                    : (file.size / 1024).toFixed(2) + ' KB';
                fileNameDiv.textContent = `✓ ${file.name} (${size})`;
                recordedAudioBlob = null; // 清除已录制的音频
            }
        });

        // 处理表单重置
        form.addEventListener('reset', () => {
            recordedAudioBlob = null;
            fileNameDiv.textContent = '';
            errorDiv.classList.remove('show');
            resultSection.classList.remove('show');
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // 优先使用已录制的音频，否则使用上传的文件
            let audioFile = recordedAudioBlob ? 
                new File([recordedAudioBlob], 'recorded_audio.wav', { type: 'audio/wav' }) :
                audioInput.files[0];
            
            if (!audioFile) {
                showError('请选择或录制音频文件');
                return;
            }

            errorDiv.classList.remove('show');
            resultSection.classList.remove('show');
            loading.classList.add('show');

            try {
                const formData = new FormData();
                formData.append('audio', audioFile);
                const targetLang = targetLangSelect.value;
                if (targetLang) {
                    formData.append('target_language', targetLang);
                }

                const response = await fetch(`${API_BASE}/transcribe`, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || '处理失败');
                }

                const data = await response.json();
                await displayResults(data);
            } catch (error) {
                showError(error.message || 'API连接错误');
            } finally {
                loading.classList.remove('show');
            }
        });

        async function correctTranscriptWithSiliconFlow(text, languageName) {
            const rawText = text.trim();
            if (!rawText) return '';

            if (
                SILICONFLOW_PLACEHOLDER_VALUES.has(SILICONFLOW_API_KEY) ||
                SILICONFLOW_PLACEHOLDER_VALUES.has(SILICONFLOW_MODEL)
            ) {
                return '';
            }

            const response = await fetch(SILICONFLOW_API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${SILICONFLOW_API_KEY}`
                },
                body: JSON.stringify({
                    model: SILICONFLOW_MODEL,
                    temperature: 0.1,
                    max_tokens: 1200,
                    messages: [
                        {
                            role: 'system',
                            content: [
                                '你是语音识别文本纠错助手。',
                                '只修正明显的同音词、近音词、断句、标点、大小写和专业词汇错误。',
                                '中文文本需要补充自然标点，修正常见错别字和不合理断句。',
                                '不要改写原意，不要扩写，不要解释。',
                                '只输出修正后的文本。'
                            ].join('')
                        },
                        {
                            role: 'user',
                            content: `识别语言：${languageName || 'unknown'}\n待纠错文本：\n${rawText}`
                        }
                    ]
                })
            });

            const payload = await response.json();
            if (!response.ok) {
                throw new Error(payload.error?.message || payload.message || 'SiliconFlow correction failed');
            }

            return payload.choices?.[0]?.message?.content?.trim() || '';
        }

        async function displayResults(data) {
            resultSection.classList.add('show');
            const detectedLanguage = data.language_name || data.detected_language;
            const rawTranscript = data.transcribed_text || '';
            detectedLangDiv.textContent = detectedLanguage;
            transcribedTextDiv.textContent = rawTranscript || '无结果';
            aiCorrectionCard.style.display = 'none';
            translationCard.style.display = 'none';

            try {
                const correctedText = await correctTranscriptWithSiliconFlow(rawTranscript, detectedLanguage);
                if (correctedText) {
                    aiCorrectedTextDiv.textContent = correctedText;
                    aiCorrectionCard.style.display = 'block';
                }
            } catch (error) {
                console.warn('AI correction skipped:', error);
            }

            if (data.translated_text) {
                translatedTextDiv.textContent = data.translated_text;
                translationCard.style.display = 'block';
            }
        }

        function showError(message) {
            errorDiv.textContent = '✗ 错误: ' + message;
            errorDiv.classList.add('show');
        }

        window.addEventListener('load', async () => {
            try {
                await fetch(`${API_BASE}/health`, { timeout: 5000 });
            } catch (error) {
                console.warn('API不可用');
            }
        });
    </script>
</body>
</html>
